openapi: 3.1.1
info:
  title: Commons Fabric API
  version: 0.1.0
  description: |-
    Events published by participating organizations.

    Errors use RFC 9457 problem details, served as `application/problem+json`.

    Two error responses apply to every path but are deliberately not attached to
    any operation, because they are returned precisely when a request matches no
    documented operation - so there is no operation under which to list them:

    - `404` - the requested path does not appear in this document.
    - `405` - the path is documented, but not for the method used.
  license:
    name: GNU Affero General Public License v3.0 or later
    identifier: AGPL-3.0-or-later
servers:
  - url: http://localhost:3000/v1 #TODO: use environment variables for this? - requires some setup in the code that parses this file. [Where?]

# Authentication is required by default, so an operation added without a thought
# about auth fails closed rather than open. The public ones opt out individually
# with `security: []` - grep for it to see the full list at a glance.
security:
  - cookieAuth: []

tags:
  - name: Events
    description: Events on the shared calendar, published by participating organizations.
  - name: Organizations
    description: The organizations participating in the calendar.
  - name: Auth
    description: Account creation and authentication.
  - name: Calendar
    description: Events as iCalendar (RFC 5545), for calendar apps to import or subscribe to.

paths:
  /auth/create-user:
    post:
      security: [] #public - self-registration -> might require some form of security later, keeping public for now 
      operationId: createUser
      tags: [Auth]
      summary: Create a user account
      description: >-
        Registers a new user under the given organization. `email` must be
        unique - a request reusing an existing address is rejected with 409.
        `password` is received as plaintext over TLS and hashed server-side
        (argon2id) before storage; it is never echoed back in a response. On
        success a signed, httpOnly session cookie is set, logging the new user
        in immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URI of the newly created user.
              required: true
              schema: { type: string, format: uri-reference }
            Set-Cookie:
              description: Signed, httpOnly session cookie (see src/utils/userSessions.ts).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      security: [] #public - credentials are the login mechanism itself
      operationId: login
      tags: [Auth]
      summary: Log in with email and password
      description: >-
        Verifies `email` and `password` against the stored argon2id hash and
        returns the matching user. On success a signed, httpOnly session
        cookie is set - see the `security` TODO at the top of this document
        for why routes do not yet require it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: Signed, httpOnly session cookie (see src/utils/userSessions.ts).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      security: [] #public
      operationId: logout
      tags: [Auth]
      summary: Log out
      description: >-
        Clears the session cookie. Succeeds even when the caller has no
        session - there is nothing server-side to invalidate, since sessions
        are stateless signed cookies (see src/utils/userSessions.ts).
      responses:
        '200':
          description: Logged out
          headers:
            Set-Cookie:
              description: Session cookie cleared.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        default: { $ref: '#/components/responses/Problem' }

  /auth/profile:
    get:
      # No `security: []` override, so the document-wide cookieAuth requirement
      # applies. Enforced by the validator (cookie present) and requireAuth
      # (src/middleware/auth.ts - signature and expiry).
      operationId: getProfile
      tags: [Auth]
      summary: Get the signed-in user
      description: >-
        Returns the user identified by the session cookie. The `id` is taken
        from the signed cookie payload and never from the request, so a caller
        can only ever read their own profile. A cookie that is missing,
        malformed or expired is answered with 401; a well-formed session whose
        user no longer exists is answered with 404.
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /events:
    get:
      security: [] #public
      operationId: listEvents
      tags: [Events]
      summary: List events overlapping a time window
      description: >-
        Returns events whose `[startsAt, endsAt]` interval overlaps the requested
        window, ordered by `startsAt`. `startDate` defaults to the current time
        and `endDate` is unbounded when omitted. `endDate` must be later than
        `startDate` - that relationship cannot be expressed in the schema, so the
        server enforces it and answers an inverted window with 400.


        Overlap, not containment: an event that began before the window and is
        still running is in it.


        The response is deliberately unpaginated and uncapped: the time window is
        what bounds the result set.
      parameters:
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/OrganizationIdFilter'
      responses:
        '200':
          description: A list of events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

    post:
      # No `security: []` override, so the document-wide cookieAuth requirement
      # applies - this is the only write operation that is not self-service auth.
      operationId: createEvent
      tags: [Events]
      summary: Create an event
      description: >-
        Creates an event owned by the signed-in user. `ownerId` is taken from the
        session cookie and is rejected if sent in the body, so a caller can only
        ever publish as themselves; `organizationId` follows from that owner.


        `endsAt` must be later than `startsAt`. JSON Schema cannot compare two
        fields, so the server enforces it and rejects an inverted interval with
        400 - mirroring the `ends_at > starts_at` CHECK in schema.dbml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URI of the newly created event.
              required: true
              schema: { type: string, format: uri-reference }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Event' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        default: { $ref: '#/components/responses/Problem' }


  /events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      security: [] #public
      operationId: getEvent
      tags: [Events]
      summary: Get a single event
      responses:
        '200':
          description: The event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /events/{eventId}/calendar.ics:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      security: [] #public
      operationId: getEventCalendar
      tags: [Calendar]
      summary: Download a single event as iCalendar
      description: >-
        The event as an RFC 5545 `VCALENDAR` holding one `VEVENT`, served as an
        attachment for "add to calendar". Its `UID` is the same one the
        subscription feed uses, so importing it and subscribing do not double up
        in clients that de-duplicate on `UID`.
      responses:
        '200':
          description: The event as an iCalendar file
          headers:
            Content-Disposition:
              description: '`attachment`, with a filename derived from the title.'
              schema: { type: string }
          content:
            text/calendar:
              schema: { $ref: '#/components/schemas/ICalendar' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /calendar.ics:
    get:
      security: [] #public
      operationId: getCalendarFeed
      tags: [Calendar]
      summary: Subscribe to events as an iCalendar feed
      description: >-
        A subscribable `VCALENDAR` of every event that ended within the last 30
        days or has yet to end, optionally narrowed to one organization. The
        lookback keeps an event in subscribers' calendars while it is running and
        after it has passed; the window is fixed rather than a parameter, because
        a subscription URL is polled unattended.


        Answers 404 when `organizationId` names no organization, so a mistyped
        subscription fails loudly instead of syncing an empty calendar forever.
      parameters:
        - $ref: '#/components/parameters/OrganizationIdFilter'
      responses:
        '200':
          description: The feed
          content:
            text/calendar:
              schema: { $ref: '#/components/schemas/ICalendar' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

  /organizations:
    get:
      security: [] #public
      operationId: listOrganizations
      tags: [Organizations]
      summary: List all participating organizations
      description: >-
        Returns every participating organization, ordered by `name`. Like
        `/events`, the response is unpaginated - the directory is bounded by the
        number of participating organizations, which is small.
      responses:
        '200':
          description: A list of organizations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Organization' }
        '400': { $ref: '#/components/responses/ValidationError' }
        default: { $ref: '#/components/responses/Problem' }

  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      security: [] #public
      operationId: getOrganization
      tags: [Organizations]
      summary: Get a single organization
      responses:
        '200':
          description: The organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: >-
        The signed, httpOnly session cookie set by `/auth/create-user` and
        `/auth/login` (see src/utils/userSessions.ts).


        Declaring this does two things. It documents which operations need a
        session - previously only discoverable by reading the routers - and it
        makes the validator reject a request that carries no session cookie
        before any handler runs. The validator only checks that the cookie is
        *present*; `requireAuth` (src/middleware/auth.ts) is what verifies the
        signature and expiry, and is still what puts `userId` on the request. The
        two are complementary rather than redundant, and neither is sufficient
        alone: a forged cookie passes the first and fails the second.


        One ordering consequence worth knowing: the validator checks security
        before it validates the body, so an unauthenticated request gets 401
        rather than a 400 describing what else was wrong with it. That is the
        better answer - a caller with no session should not be able to probe the
        schema - but it does mean 401 can mask a body that would also have failed.

  parameters:
    # allowReserved on both date parameters: an RFC 3339 timestamp contains colons
    # (`2026-08-01T00:00:00Z`), and RFC 3986 permits a bare colon in the query
    # component. Without this the validator insists every colon arrive as %3A and
    # answers 400 otherwise - which rejects the ordinary form of the calendar's own
    # request, and the form axios produces, since it leaves `:` unescaped.
    # Percent-encoded values keep working; this only stops the raw ones being refused.
    StartDate:
      name: startDate
      in: query
      allowReserved: true
      description: Start of the time window. Defaults to the current time when omitted.
      schema: { $ref: '#/components/schemas/Timestamp' }

    EndDate:
      name: endDate
      in: query
      allowReserved: true
      description: End of the time window. Unbounded when omitted. Must be later than `startDate`.
      schema: { $ref: '#/components/schemas/Timestamp' }

    OrganizationIdFilter:
      name: organizationId
      in: query
      description: Only return events published under this organization.
      schema: { $ref: '#/components/schemas/OrganizationId' }

    EventId:
      name: eventId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/EventId' }

    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/OrganizationId' }

  schemas:
    Timestamp:
      type: string
      format: date-time
      description: >-
        Format includes timezone offset from UTC: `2026-06-16T10:00:00-04:00`

    OrganizationId:
      type: integer
      minimum: 1
      description: Identifier of an organization (an `organizations` row).

    ICalendar:
      type: string
      description: >-
        An RFC 5545 `VCALENDAR` with no `METHOD` - a snapshot, not a scheduling
        message. Times are UTC. Each `VEVENT`'s `UID` is a random v4 UUID
        (RFC 7986 section 5.3) stored with the event and fixed for its lifetime;
        it is unrelated to the event's `id`.

    UserId:
      type: integer
      minimum: 1
      description: Identifier of a user.

    EventId:
      type: integer
      minimum: 1
      description: Identifier of an event.

    OrganizationTag:
      type: string
      description: >-
        A category an organization can be listed under. Mirrors the `org_tags`
        enum in db/schema.dbml; SQLite has no enum type, so the same values are
        held by the `IN (...)` CHECK on `organizations_tags.tag`.
      enum:
        - Advocacy
        - Civic
        - Community
        - Culture
        - Education
        - Equity
        - Indigenous
        - Makers
        - Policy
        - Research
        - Seniors
        - Settlement
        - Tech
        - Volunteer
        - Youth

    Organization:
      type: object
      description: A participating organization. Mirrors the `organizations` table.
      required: [id, name]
      properties:
        id: { $ref: '#/components/schemas/OrganizationId', readOnly: true }
        name:
          type: string
          minLength: 1
          pattern: '\S'
          description: >-
            The `pattern` matches the `length(trim(name)) > 0` CHECK in
            schema.dbml.
        logo:
          type: [string, 'null']
          format: uri-reference
          description: >-
            Server-relative path to the logo image, e.g.
            `./public/organization_logos/example.jpg` - not an absolute URL.
        blurb: { type: [string, 'null'] }
        contact:
          type: [string, 'null']
          format: email
          maxLength: 255
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: >-
            SQLite stores this unconstrained (see the note at the top of
            schema.prisma). `pattern` mirrors the DBML CHECK and `format` applies
            ajv's own rule - neither subsumes the other, so both are declared and
            a value has to satisfy both.
        website:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          pattern: '^https?://[^\s/$.?#].[^\s]*$'
          description: >-
            Restricted to http(s), mirroring the CHECK in schema.dbml. See the
            case-sensitivity note on `Event.registrationLink`.
        tags:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/OrganizationTag' }
          description: >-
            The organization's categories. An organization with no tags yields
            an empty array.

    UserCore:
      type: object
      description: The client-supplied half of a user. Mirrors the `users` table.
      required: [fullname, email, organizationId]
      properties:
        fullname:
          type: string
          minLength: 1
          pattern: '\S'
          description: >-
            The `pattern` matches the `length(trim(fullname)) > 0` CHECK in
            schema.dbml.
        email:
          type: string
          format: email
          maxLength: 255
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: >-
            Must be unique across users; a request reusing an existing address
            is rejected with 409. `pattern` mirrors the DBML CHECK and `format`
            applies ajv's own rule - see the note on `Organization.contact`.
        organizationId: { $ref: '#/components/schemas/OrganizationId' }

    UserCreate:
      allOf:
        - $ref: '#/components/schemas/UserCore'
        - type: object
          required: [password]
          properties:
            password:
              type: string
              minLength: 8
              writeOnly: true
              description: >-
                Plaintext password, sent once over TLS and hashed (argon2id)
                server-side before storage. Mirrors the
                `length(password) > 0` CHECK in schema.dbml, with a minimum
                length enforced at the application layer.
      description: >-
        Unknown properties are rejected rather than ignored, so a request that
        tries to smuggle in `id` or `createdAt` (or any other server-assigned
        field) fails validation instead of being silently dropped.
      unevaluatedProperties: false

    User:
      allOf:
        - $ref: '#/components/schemas/UserCore'
        - type: object
          required: [id, createdAt]
          properties:
            id: { $ref: '#/components/schemas/UserId', readOnly: true }
            createdAt: { $ref: '#/components/schemas/Timestamp', readOnly: true }

    UserLogin:
      type: object
      description: >-
        Unknown properties are rejected rather than ignored, so a request that
        tries to smuggle in extra fields fails validation instead of being
        silently dropped.
      required: [email, password]
      unevaluatedProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          writeOnly: true
          description: Plaintext password, sent once over TLS and checked against the stored argon2id hash.

    EventCore:
      type: object
      description: >-
        The client-supplied half of an event. Everything the server assigns -
        `id`, `ownerId`, `organizationId`, `createdAt` - lives on `Event`
        instead, so none of it can be supplied on a create.
      required: [title, startsAt, endsAt]
      properties:
        title:
          type: string
          minLength: 1
          pattern: '\S'
          description: >-
            The `pattern` requires at least one non-whitespace character,
            matching the `length(trim(title)) > 0` CHECK in schema.dbml -
            `minLength` alone would admit `"   "`.
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt:
          $ref: '#/components/schemas/Timestamp'
          description: >-
            Must be later than `startsAt`. Enforced server-side rather than in
            the schema, since JSON Schema cannot compare two fields.
        location: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        thumbnail:
          type: [string, 'null']
          format: uri-reference
          description: >-
            Server-relative path to the event image, e.g.
            `./public/event_images/example.jpg` - not an absolute URL.
        registrationLink:
          type: [string, 'null']
          format: uri
          pattern: '^https?://[^\s/$.?#].[^\s]*$'
          description: >-
            Restricted to http(s), mirroring the CHECK in schema.dbml. That
            CHECK is case-insensitive (`~*`) while JSON Schema patterns are not,
            so an uppercase scheme is rejected here though the database would
            accept it - normalise the scheme before insert.
        volunteerContact:
          type: [string, 'null']
          format: email
          maxLength: 255
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          description: >-
            `pattern` mirrors the DBML CHECK and `format` applies ajv's own rule;
            see the note on `Organization.contact`.

    EventCreate:
      $ref: '#/components/schemas/EventCore'
      description: >-
        Unknown properties are rejected rather than ignored, so a request that
        tries to smuggle in `ownerId` (or any other server-assigned field) fails
        validation instead of being silently dropped.
      unevaluatedProperties: false

    Event:
      allOf:
        - $ref: '#/components/schemas/EventCore'
        - type: object
          required: [id, ownerId, organizationId, createdAt]
          properties:
            id: { $ref: '#/components/schemas/EventId', readOnly: true }
            ownerId:
              $ref: '#/components/schemas/UserId'
              readOnly: true
              description: >-
                The user who owns the event, resolved from the authenticated
                caller at creation time - never from the request body.
            organizationId:
              $ref: '#/components/schemas/OrganizationId'
              readOnly: true
              description: >-
                The owning user's organization, resolved server-side by
                following `ownerId` - the `events` table has no organization
                column of its own. Clients match this against the organizations
                they hold rather than fetching per event; it is also what the
                `organizationId` query parameter filters on.


                Because the link is derived rather than stored, it tracks the
                owner's *current* organization - if a user moves organizations,
                their past events move with them. Storing the publishing
                organization on the event instead would be a schema change.
            createdAt: { $ref: '#/components/schemas/Timestamp', readOnly: true }

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, default: 'about:blank' }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, format: uri-reference }

    ValidationProblem:
      description: >-
        A `Problem` carrying the RFC 9457 `errors` extension. `errors` is present
        whenever the failure can be attributed to specific fields, and absent
        when it cannot - a body that is not parseable as JSON, for instance, has
        no field to point at.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              minItems: 1
              items:
                type: object
                required: [pointer, detail]
                properties:
                  pointer:
                    type: string
                    description: >-
                      JSON Pointer to the offending value, prefixed with the part
                      of the request it came from - e.g. `/body/startsAt`,
                      `/query/startDate`, `/params/eventId`.
                  detail: { type: string }

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    ValidationError:
      description: >-
        The request failed validation - body, query, or path parameters.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }

    UnsupportedMediaType:
      description: The request body was sent as something other than `application/json`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Conflict:
      description: >-
        The request conflicts with the current state of the resource - e.g. an
        `email` that is already registered to another user.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    Unauthorized:
      description: >-
        The caller could not be authenticated - either the supplied email and
        password did not match an existing account, or the session cookie was
        missing, malformed or expired.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
