# `docker compose up -d` starts Postgres alone, for `npm run dev` on the host.
# `docker compose --profile app up --build` also builds and runs the production app
# (backend serving the built frontend) on http://localhost:3000.
#
# Variables come from ./.env (see .env.example); Postgres falls back to the same
# dev credentials as backend/.env.example.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    profiles: [app]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dev}:${POSTGRES_PASSWORD:-dev}@db:5432/${POSTGRES_DB:-appdb}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  pgdata:
